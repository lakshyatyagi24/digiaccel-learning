services:
  postgres:
    image: postgres:16-alpine
    container_name: digiaccel-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: digiaccel
      POSTGRES_PASSWORD: digiaccel
      POSTGRES_DB: digiaccel_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiaccel -d digiaccel_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
